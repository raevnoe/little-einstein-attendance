<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Little Einstein Discovery School: daily attendance, student performance and SMS notifications for kindergarten parents." />
    <meta name="theme-color" content="#2e3192" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Little Einstein" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Little Einstein Attendance</title>
    <script>
      // Dark mode before the first paint (same rules as src/lib/theme.js; that file takes over after loading).
      (function () {
        var choice = "light";
        try { choice = localStorage.getItem("led.theme") || "light"; } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
